            ],
            correct: 1,
            explanation: "送信機は電波を発する無線設備であり、電波法に基づく技術基準等の規制を受けます。"
        },
        {
            question: "DIPS2.0で主に行う手続きはどれ？",
            options: [
                "気象観測",
                "飛行許可・承認申請や飛行計画通報",
                "映像編集"
            ],
            correct: 1,
            explanation: "DIPS2.0は無人航空機の許可・承認申請や飛行計画の通報などを行う国土交通省のシステムです。"
        }
    ];

    let userAnswers = {};
    
    function renderQuestions() {
        const container = document.getElementById('questions');
        container.innerHTML = '';
        
        questions.forEach((q, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-card';
            questionDiv.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((option, optIndex) => {
                optionsHTML += `
                    <div class="option" onclick="selectOption(${index}, ${optIndex})">
                        <input type="radio" name="q${index}" id="q${index}_${optIndex}" value="${optIndex}">
                        <label for="q${index}_${optIndex}">${option}</label>
                    </div>
                `;
            });
            
            questionDiv.innerHTML = `
                <div class="question-number">問題 ${index + 1}</div>
                <div class="question-text">${q.question}</div>
                <div class="options">${optionsHTML}</div>
                <div class="explanation" id="explanation-${index}">
                    <div class="explanation-title">💡 解説</div>
                    <div>${q.explanation}</div>
                </div>
            `;
            
            container.appendChild(questionDiv);
        });
    }
    
    function selectOption(questionIndex, optionIndex) {
        userAnswers[questionIndex] = optionIndex;
        const questionCard = document.getElementById(`question-${questionIndex}`);
        questionCard.classList.add('answered');
        
        const radios = document.querySelectorAll(`input[name="q${questionIndex}"]`);
        radios.forEach(radio => radio.checked = false);
        document.getElementById(`q${questionIndex}_${optionIndex}`).checked = true;
    }
    
    function submitQuiz() {
        if (Object.keys(userAnswers).length < questions.length) {
            alert('すべての問題に回答してください。');
            return;
        }
        
        let correctCount = 0;
        
        questions.forEach((q, index) => {
            const userAnswer = userAnswers[index];
            const options = document.querySelectorAll(`#question-${index} .option`);
            
            options.forEach((option, optIndex) => {
                if (optIndex === q.correct) {
                    option.classList.add('correct');
                }
                if (optIndex === userAnswer && userAnswer !== q.correct) {
                    option.classList.add('incorrect');
                }
            });
            
            if (userAnswer === q.correct) {
                correctCount++;
            }
            
            document.getElementById(`explanation-${index}`).classList.add('show');
        });
        
        const score = (correctCount / questions.length) * 100;
        const passed = score >= 80;
        
        const resultDiv = document.getElementById('result');
        resultDiv.className = 'result show';
        resultDiv.style.background = passed 
            ? 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)' 
            : 'linear-gradient(135deg, #eb3349 0%, #f45c43 100%)';
        
        resultDiv.innerHTML = `
            <h2>${passed ? '🎉 合格！' : '📚 不合格'}</h2>
            <div class="score">${Math.round(score)}点</div>
            <p>正解数: ${correctCount} / ${questions.length}</p>
            <p>${passed ? 'かなり仕上がってます！本番形式の問題にもチャレンジしましょう。' : '用語をもう一度見直して、再チャレンジしてください。'}</p>
        `;
        
        document.getElementById('submitBtn').disabled = true;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
    
    function resetQuiz() {
        userAnswers = {};
        renderQuestions();
        document.getElementById('result').classList.remove('show');
        document.getElementById('submitBtn').disabled = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    document.getElementById('submitBtn').addEventListener('click', submitQuiz);
    document.getElementById('resetBtn').addEventListener('click', resetQuiz);
    
    renderQuestions();
</script>
</body>
</html>
